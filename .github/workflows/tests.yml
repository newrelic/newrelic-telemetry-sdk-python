name: Tests

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:

jobs:
  # Combine and upload coverage data
  coverage:
    if: success() || failure() # Does not run on cancelled workflows
    runs-on: ubuntu-latest
    needs:
      - tests
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # 6.3.0
        with:
          python-version: "3.13"
          architecture: x64

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          path: ./

      - name: Combine Coverage
        run: |
          pip install coverage
          find . -name ".coverage.*" -exec mv {} ./ \;
          coverage combine
          coverage xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # 7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Tests
  tests:
    strategy:
      fail-fast: False
      matrix:
        os: [ubuntu-latest, windows-latest]
        python:
          - version: "3.9"
            tox-prefix: py39
          - version: "3.10"
            tox-prefix: py310
          - version: "3.11"
            tox-prefix: py311
          - version: "3.12"
            tox-prefix: py312
          - version: "3.13"
            tox-prefix: py313
          - version: "3.14"
            tox-prefix: py314
          - version: "pypy3.11"
            tox-prefix: pypy311

    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # 6.3.0
        with:
          python-version: ${{ matrix.python.version }}
          architecture: x64

      - name: Install Dependencies
        run: |
          pip install -U pip
          pip install -U wheel setuptools tox coverage

      - name: Test
        run: tox run -vv -f ${{ matrix.python.tox-prefix }} -- --cov-report=xml
        env:
          TOX_DISCOVER: "patch-for-windows-pypy3"

      - name: Upload Coverage Artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: coverage-${{ github.job }}-${{ strategy.job-index }}
          path: ./**/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Docs
        run: tox -vv
        env:
          TOXENV: docs
        if: matrix.python.version == 3.9 && matrix.os == 'ubuntu-latest'
