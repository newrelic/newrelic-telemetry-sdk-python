---
name: Check License Headers

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:

jobs:
  # Tests
  addlicense:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # 6.3.0
        with:
          python-version: 3.13
          architecture: x64

      - name: Check License Headers
        run: |
          pip install pre-commit
          pre-commit run --all-files --hook-stage pre-push addlicense --show-diff-on-failure
